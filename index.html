<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YLSH Science 5th - 園遊會收銀系統</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary-neon: #10b981; /* 螢光綠 / 湖水綠 */
            --primary-hover: #059669;
            --accent-blue: #38bdf8; /* 科技藍 */
            --danger-neon: #f43f5e; /* 警示紅 */
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 100%);
            color: var(--text-light);
            padding: 12px;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        header {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(16, 185, 129, 0.3);
            backdrop-filter: blur(8px);
            color: var(--text-light);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: var(--primary-neon);
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-toggle-view {
            background: transparent;
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .btn-toggle-view:active {
            background: var(--primary-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: 1.2fr 0.8fr;
            }
            .full-width {
                grid-column: span 2;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-blue);
        }

        /* 矩陣商品菜單 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
        }

        .menu-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .menu-item:active {
            transform: scale(0.96);
            border-color: var(--primary-neon);
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .menu-item-name {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .menu-item-price {
            color: var(--primary-neon);
            font-weight: bold;
            font-size: 1rem;
        }

        /* 購物車區 */
        .cart-list {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 14px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 500;
            color: var(--text-light);
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-qty {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .btn-qty:active {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .cart-summary {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed #475569;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--danger-neon);
            margin-bottom: 18px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.2);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-neon);
            color: var(--bg-dark);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        }

        .btn-submit:active {
            background: var(--primary-hover);
            transform: scale(0.98);
        }

        /* 數據與排單模組 */
        .order-queue {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .order-card {
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.4);
            border-left: 4px solid var(--accent-blue);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-number {
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .order-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .order-details {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #cbd5e1;
            white-space: pre-line;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #232d3f;
        }

        .order-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-action {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn-complete {
            background: var(--primary-neon);
            color: var(--bg-dark);
        }

        .btn-complete:active {
            background: var(--primary-hover);
        }

        .btn-delete {
            background: transparent;
            color: var(--danger-neon);
            border: 1px solid var(--danger-neon);
        }

        .btn-delete:active {
            background: rgba(244, 63, 94, 0.1);
        }

        /* 報表網格 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #0f172a;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #232d3f;
        }

        .stat-val {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-neon);
            margin-top: 6px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .rank-list {
            font-size: 0.95rem;
            list-style: none;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #334155;
        }

        /* 管理端表格 */
        .mgmt-form {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .mgmt-input {
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #0f172a;
            color: var(--text-light);
        }

        .mgmt-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .btn-add-prod {
            background: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .mgmt-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .btn-remove-prod {
            background: none;
            border: 1px solid var(--danger-neon);
            color: var(--danger-neon);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-reset {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .empty-tips {
            text-align: center;
            color: var(--text-muted);
            padding: 24px 0;
            font-size: 0.9rem;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 id="headerTitle">🧬 YLSH Science 5th (前台點餐)</h1>
            <p id="headerSub">宜中第五屆科學班 • 園遊會專用量子收銀系統</p>
        </div>
        <button class="btn-toggle-view" id="btnToggle">⚙️ 進入後台數據</button>
    </header>

    <!-- 前台點餐 -->
    <div id="frontView" class="view-section active">
        <div class="grid-container">
            <div class="card">
                <div class="card-title">🔬 點選量子商品</div>
                <div class="menu-grid" id="menuGridFront"></div>
                
                <div class="cart-summary">
                    <div class="card-title" style="border:none; margin:0; padding:0 0 10px 0;">🛒 暫存點餐籃</div>
                    <div class="cart-list" id="cartListFront">
                        <div class="empty-tips">點餐籃空無一物，請點選上方商品</div>
                    </div>
                    <div class="total-row">
                        <span>能量總計</span>
                        <span id="totalPriceFront">NT$ 0</span>
                    </div>
                    <button class="btn-submit" onclick="submitOrder()">發射訂單 🪐 生成號碼牌</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 後台數據 -->
    <div id="backView" class="view-section">
        <div class="grid-container">
            
            <div class="card">
                <div class="card-title">
                    <span>📊 核心營收觀測站</span>
                    <button class="btn-reset" onclick="resetAllData()">全面重置實驗數據</button>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div style="font-size:0.8rem; color:var(--text-muted);">總營業額</div>
                        <div class="stat-val" id="statRevenue">NT$ 0</div>
                    </div>
                    <div class="stat-box">
                        <div style="font-size:0.8rem; color:var(--text-muted);">已接收波段 (總單數)</div>
                        <div class="stat-val" id="statOrderCount">0 單</div>
                    </div>
                </div>
                <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: var(--accent-blue);">🔥 元素熱銷排行：</div>
                <ul class="rank-list" id="rankList">
                    <div class="empty-tips" style="padding: 5px 0;">暫無觀測 sales 資料</div>
                </ul>
            </div>

            <div class="card">
                <div class="card-title">🛠️ 物質合成控制 (商品編輯)</div>
                <div class="mgmt-form">
                    <input type="text" id="newProdName" class="mgmt-input" placeholder="元素名稱" style="flex:2;">
                    <input type="number" id="newProdPrice" class="mgmt-input" placeholder="單價" style="flex:1;">
                    <button class="btn-add-prod" onclick="addNewProduct()">合成新增</button>
                </div>
                <div style="font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: var(--text-muted);">現存元素列表：</div>
                <div id="mgmtProductList"></div>
            </div>

            <div class="card full-width">
                <div class="card-title">📋 粒子反應排隊佇列 (現場排單)</div>
                <div class="order-queue" id="orderQueueBack">
                    <div class="empty-tips">無處於激發態的訂單</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "科學珍奶", price: 60 },
            { id: 2, name: "極客炸雞", price: 70 },
            { id: 3, name: "量子薯條", price: 40 },
            { id: 4, name: "反應堆紅茶", price: 30 }
        ];

        let products = JSON.parse(localStorage.getItem('bazaar_products')) || defaultProducts;
        let orders = JSON.parse(localStorage.getItem('bazaar_orders')) || [];
        let nextOrderNumber = parseInt(localStorage.getItem('bazaar_next_number')) || 1;
        let cart = {}; 
        let currentView = 'front';

        window.onload = function() {
            document.getElementById('btnToggle').addEventListener('click', toggleView);
            renderAll();
        };

        function renderAll() {
            renderMenuFront();
            renderCartFront();
            renderOrdersBack();
            updateStatsBack();
            renderMgmtProducts();
        }

        function renderMenuFront() {
            const menuGrid = document.getElementById('menuGridFront');
            if (products.length === 0) {
                menuGrid.innerHTML = '<div class="empty-tips">無商品，請至後台合成！</div>';
                return;
            }
            menuGrid.innerHTML = products.map(p => `
                <div class="menu-item" onclick="addToCart(${p.id})">
                    <div class="menu-item-name">${p.name}</div>
                    <div class="menu-item-price">NT$ ${p.price}</div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            cart[productId] = (cart[productId] || 0) + 1;
            renderCartFront();
        }

        function updateCartQty(productId, change) {
            if (!cart[productId]) return;
            cart[productId] += change;
            if (cart[productId] <= 0) delete cart[productId];
            renderCartFront();
        }

        function renderCartFront() {
            const cartList = document.getElementById('cartListFront');
            const totalPriceEl = document.getElementById('totalPriceFront');
            const cartKeys = Object.keys(cart);
            
            if (cartKeys.length === 0) {
                cartList.innerHTML = '<div class="empty-tips">點餐籃空無一物，請點選上方商品</div>';
                totalPriceEl.innerText = 'NT$ 0';
                return;
            }

            let total = 0;
            let html = '';

            cartKeys.forEach(id => {
                const prod = products.find(p => p.id == id);
                if (prod) {
                    const qty = cart[id];
                    total += prod.price * qty;
                    html += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${prod.name}</div>
                                <div class="cart-item-price">NT$ ${prod.price} × ${qty}</div>
                            </div>
                            <div class="quantity-control">
                                <button class="btn-qty" onclick="updateCartQty(${id}, -1)">-</button>
                                <span style="font-weight:bold; min-width:16px; text-align:center;">${qty}</span>
                                <button class="btn-qty" onclick="updateCartQty(${id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                }
            });

            cartList.innerHTML = html;
            totalPriceEl.innerText = `NT$ ${total}`;
        }

        function submitOrder() {
            const cartKeys = Object.keys(cart);
            if (cartKeys.length === 0) {
                alert('點餐籃空無一物！');
                return;
            }

            let details = [], total = 0, itemsArray = [];

            cartKeys.forEach(id => {
                const prod = products.find(p => p.id == id);
                if (prod) {
                    const qty = cart[id];
                    details.push(`${prod.name} x ${qty}`);
                    total += prod.price * qty;
                    itemsArray.push({ id: prod.id, name: prod.name, qty: qty });
                }
            });

            const orderNumStr = '#' + String(nextOrderNumber).padStart(3, '0');
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            orders.push({
                id: Date.now(),
                numberStr: orderNumStr,
                time: timeStr,
                detailsText: details.join('\n'),
                items: itemsArray,
                totalPrice: total,
                status: 'pending'
            });
            nextOrderNumber++;

            saveToLocalStorage();
            cart = {};
            renderCartFront();
            renderOrdersBack();
            updateStatsBack();

            alert(`⚡ 激發成功！\n量子號碼牌：${orderNumStr}\n交收能量：NT$ ${total}`);
        }

        function renderOrdersBack() {
            const orderQueue = document.getElementById('orderQueueBack');
            const pendingOrders = orders.filter(o => o.status === 'pending');

            if (pendingOrders.length === 0) {
                orderQueue.innerHTML = '<div class="empty-tips">無處於激發態的訂單</div>';
                return;
            }

            orderQueue.innerHTML = pendingOrders.map(o => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-number">${o.numberStr}</span>
                        <span class="order-time">時戳 ${o.time}</span>
                    </div>
                    <div class="order-details">${o.detailsText}</div>
                    <div style="font-size:0.95rem; font-weight:bold; color:var(--danger-neon); margin-bottom:12px;">能量值: NT$ ${o.totalPrice}</div>
                    <div class="order-actions">
                        <button class="btn-action btn-delete" onclick="deleteOrder(${o.id})">湮滅單</button>
                        <button class="btn-action btn-complete" onclick="completeOrder(${o.id})">完成釋放</button>
                    </div>
                </div>
            `).join('');
        }

        function completeOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = 'completed';
                saveToLocalStorage();
                renderOrdersBack();
                updateStatsBack();
            }
        }

        function deleteOrder(orderId) {
            if (confirm('確定崩解此訂單？數據將扣除。')) {
                orders = orders.filter(o => o.id !== orderId);
                saveToLocalStorage();
                renderOrdersBack();
                updateStatsBack();
            }
        }

        function updateStatsBack() {
            let totalRevenue = 0, productSales = {};

            orders.forEach(o => {
                totalRevenue += o.totalPrice;
                o.items.forEach(item => {
                    productSales[item.name] = (productSales[item.name] || 0) + item.qty;
                });
            });

            document.getElementById('statRevenue').innerText = `NT$ ${totalRevenue}`;
            document.getElementById('statOrderCount').innerText = `${orders.length} 單`;

            const sortedSales = Object.keys(productSales).map(name => ({ name, qty: productSales[name] })).sort((a, b) => b.qty - a.qty);
            const rankList = document.getElementById('rankList');
            
            if (sortedSales.length === 0) {
                rankList.innerHTML = '<div class="empty-tips" style="padding: 5px 0;">暫無銷售數據</div>';
                return;
            }

            rankList.innerHTML = sortedSales.map((item, index) => `
                <li class="rank-item">
                    <span>${index + 1}. ${item.name}</span>
                    <span style="font-weight:bold; color:var(--primary-neon);">${item.qty} 份</span>
                </li>
            `).join('');
        }

        function addNewProduct() {
            const nameInput = document.getElementById('newProdName'), priceInput = document.getElementById('newProdPrice');
            const name = nameInput.value.trim(), price = parseInt(priceInput.value);

            if (!name || isNaN(price) || price < 0) return alert('元素合成資訊錯誤！');

            if (confirm(`確定要合成新元素「${name}」？`)) {
                products.push({ id: Date.now(), name, price });
                localStorage.setItem('bazaar_products', JSON.stringify(products));
                nameInput.value = ''; priceInput.value = '';
                renderMenuFront(); renderMgmtProducts();
            }
        }

        function removeProduct(productId) {
            const prod = products.find(p => p.id === productId);
            if (prod && confirm(`確定崩解「${prod.name}」？前台按鈕將消失。`)) {
                products = products.filter(p => p.id !== productId);
                localStorage.setItem('bazaar_products', JSON.stringify(products));
                cart = {};
                renderMenuFront(); renderCartFront(); renderMgmtProducts();
            }
        }

        function renderMgmtProducts() {
            const listEl = document.getElementById('mgmtProductList');
            if (products.length === 0) {
                listEl.innerHTML = '<div class="empty-tips" style="padding:10px 0;">無存在元素</div>';
                return;
            }
            listEl.innerHTML = products.map(p => `
                <div class="mgmt-list-item">
                    <span><strong>${p.name}</strong> (NT$ ${p.price})</span>
                    <button class="btn-remove-prod" onclick="removeProduct(${p.id})">崩解元素</button>
                </div>
            `).join('');
        }

        function saveToLocalStorage() {
            localStorage.setItem('bazaar_orders', JSON.stringify(orders));
            localStorage.setItem('bazaar_next_number', nextOrderNumber.toString());
        }

        function toggleView() {
            const frontView = document.getElementById('frontView'), backView = document.getElementById('backView');
            const btnToggle = document.getElementById('btnToggle'), headerTitle = document.getElementById('headerTitle');

            if (currentView === 'front') {
                currentView = 'back';
                frontView.classList.remove('active'); backView.classList.add('active');
                btnToggle.innerText = '📱 回到量子前台';
                headerTitle.innerText = '🧬 YLSH Science 5th (後台觀測)';
                renderAll(); 
            } else {
                currentView = 'front';
                backView.classList.remove('active'); frontView.classList.add('active');
                btnToggle.innerText = '⚙️ 進入後台數據';
                headerTitle.innerText = '🧬 YLSH Science 5th (前台點餐)';
            }
        }

        function resetAllData() {
            if (confirm('⚠️ 警告：這將會完全湮滅所有實驗數據！確定清除？')) {
                localStorage.removeItem('bazaar_orders'); localStorage.removeItem('bazaar_next_number');
                orders = []; nextOrderNumber = 1; cart = {};
                renderCartFront(); renderOrdersBack(); updateStatsBack();
                alert('數據已徹底清空！');
            }
        }
    </script>
</body>
</html>
